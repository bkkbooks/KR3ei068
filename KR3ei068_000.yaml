front:
  text: 序南都雷氏子鳴大震類集詩書間嘗檢閲得宋版醫書一帙喜而嘆曰是書不有補於娠婦者也何鳴得之太晚耶遂慨然鋟梓以行刻成請豫敘諸首簡豫得而覽之乃形諸喟然曰是編不惟有補於娠婦而亦大有助醫家者後世之人何幸耶名曰濟生産寶論方者一皆士大夫黯理精當而有得於經驗者其所用之藥君臣佐使不越乎古方書之所記載而醫藥者之所錯綜非有泛也雖然知濟生之道為可尚而不思所以鋟諸梓非義也思可以鋟諸梓而不慮可傳行之不及其遠且久者非仁也君子謂斯舉也亦仁義而已矣俾娠子之婦有可逃於夭折之歸而順適於仁壽之境其功德不亦傳哉豫不佞不敢沒人之善故僭書之首嘉靖乙未夏四月既望浙進士雙峰王子沖書
