body:
  text: 下卷郭稽中産後二十一證論評方第一論曰熱病胎死腹中者何也答曰母因患熱病至六七日以後臟腑極熱熏蒸其胎是以致死緣兒身死不能自出但服黑神散暖其胎須臾胎氣暖即自出何以知其胎之已死但看産母舌青是其候也黑神散桂心不見火川當歸芍藥甘草炙乾薑炮生地黃黑豆炒去皮各一錢黑附子三錢炮計八錢半細末作四服空心溫酒調下評曰妊娠重身二命所繫將理失宜皆能損胎不特因熱熏蒸所致如未出切恐因頓僕驚怕出入觸冒或有癥瘕積聚壞胎者其候亦舌青子死乃是敗血作熱內攻以致昏厥命在須臾四物湯加黃芩急煎並三服救之若覺曾驚僕腹痛不能忍者必是懷胎敗血所致可先服黑神散痛稍定方令上草自無慮矣或若先以佛手散探之方在胎前第十八問後篇又牛膝湯亦治方在後第三論中第二論曰難産者何答曰胎側有成形塊為兒枕子欲生時枕破敗血裹其子故難産但服勝金散逐其敗血即自生若逆生橫生並皆治之勝金散真麝香少許研多亦好鹽豉一錢乃豆咸豉以舊青布裹燒紅急研細相合燒稱鎚酒淬調服評曰不只是胎側有兒枕破與敗血裹凝其如橫逆因坐草大早努力過多兒轉未及若以破水出其血必干亦致難産若露腳謂之逆露手謂之橫當以針微刺自縮若産門已露頭髮兒未得出急令老娘覷探恐是臍帶攀住兒肩此非藥療可擬宜分開臍帶産母打噴嚏自生又法用單被蓋産母自頭至腰少時溫揭去得氣頓通立生若先多服神應黑散以固其血兒身自轉生並無前件難證更煉蜜新汲水調吃鎮在心頭永無血悶之厄神應黑散臨産雖無事亦可先服百草霜燒竹茅根鍋底墨太平白芷不見火等分細末挑三錢好醋調入童子小便湯浸一服橫生逆生甚者再服立生更有鉛丹方在胎前第十五問中並有黑龍丹方在前十八問後又法助生以牛糞洗內揀豆一顆擘一片書父入字書子出字再合豆水吞下又法先晚産母常著衣一件蓋灶頭免胎衣不下之意又法偷剪鍾馗左腳燒灰水下又法尋左腳舊草鞋底燒灰三錢水下又法不作聲將花錢倒提廁前頂禮倒燒急回以上五法用試一二神驗不可不作第三論曰胎衣不下者何答曰母生子訖血流入胞衣中衣為血所脹是故不得下治之稍緩脹滿腹中以攻上衝心胸疼痛喘急者但服奪命丹以逐去衣中之血血散脹消胎衣自下奪命丹胎前先合第六論皆因大黃四錢黑附子二錢炮去皮牡丹皮四錢乾漆一錢炒煙盡研入藥丸雞子白制恐脹胃生瘡為末同膏子入雞子白搗勻梧桐子大溫酒急吞五七丸如未下有牛膝湯急服立下若子死不出亦下牛膝一錢洗瞿麥一錢滑石二錢川當歸洗木通各一錢半葵採子一錢二分半如無黃蜀花或子亦可計八錢二分半銼末分作二服水二盞半煎一盞服宜預備修合洪氏方云胎衣不下合諸血奔上衝心遂致不救有産前失血過多胞衣乾澀亦不下庸醫不省例用破血藥卻不知血盡轉澀舊有産婦胎衣不下呻吟楚痛聲不可聞忽有人教之用苧麻或根煎水吃兩碗致而得嘔吐其胎衣便下或用乾荷葉濃煎湯一盞服立下楊氏云或因胎臟積熱才覺胎衣不出急令人於産婦後以兩手當心前交指抱心挾定提防胎衣湊心奔從口出大有所損急進下胎衣藥抱心人須寬手放藥下緣慣産婦多輕易不可不防又有數日不得分娩或死胎或胎衣不下急用萆麻子七粒去殼研爛塗兩腳心下了急洗去萆麻子小産同用第四論曰産後血暈者何答曰産後氣血暴虛未得安靜血隨氣上迷亂心神故眼前生花極甚者令人悶絶不知人事口噤神昏氣冷醫者不識呼為暗風若作此治病必難愈但服清魂散自瘥胎前預備清魂散澤蘭葉人參各六錢荊芥穗一錢半川芎六錢二分半甘草半兩計五錢細末作三服酒湯各半盞調急灌下喉眼開氣省人事其證危險急燒乾漆大煙沖醒隨後進藥評曰産後眩暈頃刻害人設使清魂不省必是出血過多虛極也急用芎藭湯救之急問老娘出血過多便服此藥若産血如常花蕊石散治之芎藭湯芎藭川當歸各六錢計一兩二錢分作四服水一盞半煎至七分熱服併合再服獨行散專治血暈迷悶五靈脂不夾石溫者六錢半炒半生細末挑三錢熟水下口噤以尺斡開灌下神效花蕊石散救産後氣欲絶緣敗血不盡迷暈子死腹中或胎衣不下至死急挑三錢童子小便調服取下惡物如豬肝終身不患血疾如膈上有血化為黃水吐出或小便中出若先下胎衣則泛上藥不能達如先救血悶則尋常藥無此兩全之功預備臨期恨無此藥連手不救不問大産小産過完急挑三錢童小便或酒調服可保無慮若倉皇未辨間急燒漆器猛煙沖産婦即醒雖無事晝夜亦略燒醋炭沖之仍令高枕頻頻叫醒勿令睡重亦不與多語此一證人命如風燭若不頻救必致血暈而死醫者先喻産家得免橫夭陰功有歸也如家有孕婦當預備蓋小産亦有血暈惡證第五論曰産後口乾痞悶者何答曰産後榮衛大虛血氣未定食麵太早胃不能消化面毒結聚胃脘上重胸中是以口乾燥渴心下痞悶醫者不識認為胸膈壅滯以藥下之其證轉盛但服見現丸立愈見現丸薑黃京三稜炮蓽澄茄良薑人參果州陳皮小薄辣者去白計一兩五分為末薄切蘿蔔搗爛研細將汁煮麵糊丸如梧桐子大每服三十丸蘿蔔或子煎湯下評曰如服未效恐不因吃麵是內積憂煩外傷燥熱飲食甘辛亦使口乾痞悶當問病家察時調治若心煩四物湯去地黃加人參烏梅若外傷燥熱又恐是乳欲行氣血弱使然其方在後第六論去乾薑甘草加烏梅第六論曰産後乍寒乍熱者何答曰陰陽不和敗血不散能令作寒作熱産後血氣虛損陰陽不和陰勝則寒陽勝則熱陰陽相乘或寒或熱若因産勞臟腑血弱不得起越故令敗血不散入於肺則熱入於脾則寒醫人若作瘧疾治之則誤也陰陽不和增損四物湯敗血不散奪命丹方在第三論又問二者何以辨之答曰時有刺痛者敗血也但寒無他證者陰陽不和也川當歸洗人參白芍藥川芎乾薑炮二錢半甘草一錢炙計一兩三錢半銼末作五服水一盞姜五片煎六分熱服評曰乍寒乍熱榮衛不和難以輕議若敗血不散豈只入脾肺二臟大抵一陰一陽即作寒陰勝作寒陽勝作熱只云敗血循經流入閉諸陰則寒閉諸陽則熱榮與衛解則休遇再會而復作如二藥不效有大調經散治之大調經散治血虛惡露未消氣為敗濁凝滯榮衛不調陰陽相乘憎寒發熱或自汗或腫滿皆榮衛未平大豆黑者三錢炮去皮茯神二錢真琥珀辨真假將於掌心擦令熱聞無膠香氣者真或瓦盞溶如錫糖黏者真放冷研用二錢計五錢二分細末挑二錢濃煎黑紫蘇湯調服琥珀真者每兩約值一千左右如一錢貴不過三百令使二分五十又可買若用三四分尤妙第七論曰産後四肢虛腫者何答曰母生子訖例服黑神散及芎藭湯者取其逐瘀血以生新血也倘惡露不盡停留胞絡生病多端輕者為脹為痛為寒為熱甚者月水不調閉斷不通久成血瘕以致尫羸有如産後面目四肢浮腫此由敗血乘虛停積於五臟循經流入四肢留淫日深腐壞如水致令浮腫醫者不審便作水氣治之投以甘遂大戟等藥以導其水虛之復虛因茲夭枉者多矣但服調經散血行腫消自良也黑龍丹亦治産後浮腫血滯所致不可不知調經散沒藥別研真琥珀別研各一錢肉桂不見火赤芍藥當歸去蘆酒浸各一兩麝香半錢別研細辛洗半錢甘草炙二錢上為細末每服半錢生薑汁溫酒各少許調勻服黑龍丹方載産後雜病證下評曰産後浮腫多端有懷孕時先腫至産後不退有産後失於將理外感寒暑風濕內作喜怒憂驚血氣相搏留滯經絡氣分血分不可不辨調經散只治血分如未退枳朮湯奪命散大調經散皆緊要藥也枳朮湯治心下堅大如盤邊如禳盤名曰氣分枳實燒去穰二錢半白朮計七錢半銼末作三服水一盞半煎七分溫服腹軟即散奪命散治虛腫喘促小便不利生薑一兩取汁白麵一兩半夏三個湯洗去滑破之以生薑汁搜麵裹半夏為三餅炙焦為末熟水酒二錢小便利為功大調經散治腹滿喘息煩渴小便不利方在第六論第八論曰産後乍見鬼神者何答曰肝能藏血心能主血因産走耗其血勞動肝心敗血奔沖邪淫於心所以乍見鬼神言語顛倒非風邪也但服調經散加生龍腦一捻煎服得睡即安黑龍丹亦能治療調經散方載第七論下黑龍丹方載産後雜病證下柏子仁散治産後狂言亂語乍見鬼神柏子仁遠志生地黃人參桑寄生防風當歸甘草琥珀各等分上為粗末每服先用白羊心一個切片以水一大盞半先煮至九分去羊心入藥末煎至六分去渣無時服第九論曰産後不語者何答曰心者君主之官神明出焉內候血海外應於舌心者聲之機産後敗血停蓄上干於心心氣閉塞則舌強而不語矣但服八珍散自瘥八珍散人參石菖蒲生地黃酒蒸焙細辛洗淨一兩川芎各一兩硃砂別研防風去蘆各半兩甘草炙半兩上為細末每服一錢薄荷湯調下不拘時候服地黃多喜戀膈脾胃不快者以當歸代之其效尤著孤鳳散治閉目不語以生礬二錢為細末用熱水調灌醒第十論曰産後腹痛又瀉痢者何答曰因産血氣勞傷外則腠理窮疏內則腸胃虛怯若未滿月飲冷當風邪毒乘虛進襲留於分
