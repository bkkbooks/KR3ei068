錢火煨乳香一字別研計九錢一字細末煉蜜丸如彈子大臨坐草細嚼棗湯下正產催生方蛇蛻一條洗焙乾緊卷以蚯蚓糞裹燒黑去土邊藥去土不盡不妨細末溫酒調服先覺熱悶只以新汲水調白蜜服妊娠因事跌磕子死腹中惡露妄下疼痛不已口噤欲絕用此藥探之若子死腹中立便逐下若不死腹痛止則子母俱安佛手散皆救當歸一兩酒浸川芎七錢洗細銼作四服水一盞煎泣欲干投酒一盞半煎五七沸去渣溫服如口噤斡開口灌如人行五里再灌盡四服便省立產神驗妊娠臨產難生或胎衣不下產後血暈不省人事狀如中風血崩惡露不止腹中血刺疼痛血滯浮腫血入心經語言顛倒如見鬼神血風相搏身熱頭痛或類瘧疾胎前產後一切危急狼狽垂死黑龍丹灌三四丸救活當歸五靈脂川芎高良薑生乾地黃五味各二錢計一兩細銼入砂罐內紙筋鹽泥固濟炭煅過紅去火滅冷取出細研入後藥百草霜用燒茅根草鍋底一兩硫黃乳香各三錢花蕊石火煅琥珀各二錢上五味一兩一錢細末米醋煮麵糊為丸如彈子大如要服用炭火燒藥一兩丸通紅投入生薑自然汁浸焠以無灰酒併合童子小便頓服神效不能盡述催生如聖散黃蜀葵花去帶萼若葵子尤妙焙乾為細末溫酒調服熱湯亦得曾若漏血胎臟連吃三服覺腹中氣寬胎下死胎方桂末三錢麝香當門子一個或半個和勻溫酒服須臾如手推下張華博物志曰妊娠必謹所感感於善者生子必善感於惡者生子必惡故不欲令見惡物異禽毒獸切忌食驢馬犬兔龜鱉鵝無鱗魚黏膩難消化物蕈姜乳餅之屬用醬和藿食損胎難產惟務間靜動止有節三個月之後聽誦經典詩書諷詠靜處調心目不視惡色耳不聽惡聲如此生子必賢明端正忠孝壽考也楊氏曰凡妊娠臟腑筋脈濡滯關節壅塞切忌晝寢日間難產睡胎不轉必不可等閒服藥針灸思慮悲憂驚恐胎孕須要頻停步寬緩日行三千步用溫水濯足澡浴不可入盆防水氣傷胎可保無危八九個月食葵菜臨產宜軟粥飲或煮雌雞取汁煮粥溫溫飽食則氣順下必易分娩自然無病飢渴氣乏大冷大熱物損胎又曰生產最是大事婦女多未明曉下愚嬋妾庸俗婆娘論理多端妄談休咎反使妊婦憂慮疑惑宜須即退亦不可使人知但用老人親人照顧供送為上醫人亦然王氏脈經云產育人倫莫不愛重今世希見論者且謂夫婦配合陰陽奇偶乾道成男坤道成女天元一氣既已妊娠自可將護胎息無犯禁忌生子必賢壽考令人嗜欲為樂輕棄性命反又房勞如鳥獸御之亦有時蓋房勞絡滿而經脈虛運動之間胎氣亦隨經絡所換難產傷胎墮子皆從此得然間有降生必孛惡壽夭則患生驚變生諸驚變生諸病藥難救療豈不痛哉產後百日內禁忌同若不信如犯之產婦必死醫當戒諭庶得用藥見效孫真人云大率妊娠唯在抑陰助陽素問云陰搏陽別謂之有子蓋關前為陽關後為陰尺中之脈按之搏手而不絕者妊子也婦人平居陽氣微盛無害及其妊子則方閉經隨養胎氣若陽盛搏之則經脈妄行胎乃不固素問云陰虛陽搏謂之崩其抑陽助陰之方甚多然胎前藥唯惡群隊若陰陽交雜別生他病唯是內補丸佐之使陽不至強陰不至弱陰陽調勻有益胎嗣此前人未當論及方熟地黃四兩酒蒸當歸三兩酒浸焙乾為末煉蜜丸如梧桐子大每服五十丸溫酒空心下楊子建小產云小產大產婦人之常然其間多有小產後染成大疾忽月經斷宮臟虧損不禁或血積成癥歲月久深傾損性命往往輕其小產此乃自不將息所致也而不知小產後將息當過大產十倍其大產只是大臟室虛其小產則是肌肉腐爛常切喻之大產如果中之慄待其成熟則殼口自開慄自墮是子與殼而無損傷懷胎十月已滿陰陽氣足子宮自開見生若月未足動靜誤失至令胎損胞系腐爛然後胎墮如人拆生慄碎其皮殼就中斷其根蒂取慄此小產之喻也以其胎臟損傷胞系斷爛而後胎下則小產之人其將息豈得不過於大產十倍者哉大產之後補虛臟生好血化惡血保臟氣去風邪無不安矣小產之後補虛生肌肉益氣血詢其所因解其病去風邪養臟氣加倍將息過於大產方能平復籲世人多輕小產而不將養因至百病蜂起傾危不可勝數豈不惜哉若在年幼之人小產而尊長知有此切須寬容將息以全人命更得良醫即喻於人幸莫大焉妊娠發搐名曰子癇宜漢防己湯主之漢防己牡丹皮貝母葛根防風當歸川芎茯苓澤瀉肉桂甘草炙各一錢獨活人參硬石膏各一錢為末每服挑五錢水一盞煎七分溫服加竹瀝法在第十七論霍氏曰妊娠臨產覺腹痛切宜孰忍不得強力逼迫及至產時已自氣乏仍不得令多人知又不得妄談休咎驚惶產母之心但覺腹痛漸加不得便將妊婦坐草多至損傷及諸般所苦皆因坐草所致切宜戒之且令人扶策緩緩行動懸掛繩帛令攀倚時行時立如不能進步但扶之尤勝坐草切忌才覺腹痛便令坐草此理令乖產也譬如竊娠偷生俱獲平安蓋緣不敢恣意坐臥日行忍痛無人逼迫氣順易產矣產室冬不可極熱夏不可極涼但四圍固密免致生病也凡言滿月是首尾三個月非三十日也俗習謬誤深久至於宴賀喜怒憂恚悲愁勞役房事或因鹹酸飲食不節立至生病犯事微若秋毫感病大於山嶽艱於治療切須禁戒保持方可平復楊子建曰懷妊七八個月忽然臍腹疼痛有如欲產便卻安靜名曰試月切不可坐草令人抱腰使妊婦妄亂用力然而疼痛須候胎兒身順臨逼門戶方使用力一送便生若未見胎兒身順如用力太早妄投藥餌催生譬如拔苗助長非惟無益又且反有損害名曰傷產正產之後腰腹作陣疼痛相次胎氣頓陷至臍連腰重痛穀道挺迸漸見漿水先破血下則兒身順生矣若老孃生疏謬見反誤母子可先取慣熟者問評如惑偏說遣之別倩又論產訖舉家欣喜多是聚觀生兒遺忘妊婦失顧產母以致血暈損身此乃老孃之過也是時老孃然雖照管生兒蓋產家往往不諳此理又不謂這一證壞人最快使人悼恨無已其大產小產老孃當急發產家令人專一看守產母頻頻叫醒勿令睡著時時以炭醋令吸鼻中才見運悶急燒乾漆火煙沖醒隨後檢方進藥如其不然更無生理別無救法家有娠婦可不介意以備常常總論夫人之受胎陰注陽生造化已有定分豈容一毫人力於其間耶切聞有以命書究其吉凶克害臨產之際私心意謂時乖故不令坐草驀遇胎轉便為時良催發坐草急產意迎就好時而避惡時殊不知妊婦欲產不得產未當產而強取生以主蹉跌逼迫使產母不勝痛憤而失全生豈有巢毀而卵不破乎又如顧指失掌掌既失指何存焉世之詳命書者心雖自愧不可追悔但以數終藉初舉之意而殞者只得聽其不率哀哉大凡懷孕雖云十月之胎有七八月而先產者或過月而方生者如堯母懷之十四月乃婦稟受氣血強弱之不同蓋猶命書所謂五行欲其自足勿有胎元者是也且晝夜十二時分作百刻之數氣息一萬三千五百呼吸之間便生賢愚安可力取時好惡而避貧奪富哉然命亦曰人之在幼禍福未明當考目擊之端倪驗作他年之徵兆是也已生之人猶不可前知休咎況以未生之子伺候好時預定貴賤可乎若如所欲則是不由造物反由人嗜命書者故當窮其造物限量之數察其天地盈縮之理無以偏見而枉殺人胡不聞竊娠偷生兩獲康寧者何蓋無他阻傷犯得任情性生於自然也今若為誠言初宜戒之若以為狂言聽其為之且聞之者尚不寒而慄奈母子何為之者後雖悟歿於非命然已獲殺人之過陰譴亦自難逃余竊思之可謂恩生於害而恩未生則害先至深矣籲可畏哉又有盤腸獻花產者醫書不述其事然亦可驚有臨分娩產腸先出兒即隨產俗用冷水噴產母面其腸自收此法虛弱之人切不可用恐驚怯或病或即脫絕舊法以蓖麻子四十粒研爛塗腦頂自然收上如收了即以水洗去頂上蓖麻子又有久而其腸為風吹乾不能收者以磨刀水少許火上溫過以潤盤腸煎好磁石湯一杯令產母服自收又難產證狀並方法凡臨產必須揀擇老練收生之人苟非其人多夭人命生理不順其狀甚多詳其如後一橫生謂兒先露手或臂者治法當令產母安令仰臥收生之人徐徐先推兒下截令直上漸通手以中指執其肩推上而正之漸引手攀其耳令頭正順候兒身正門路順卻投催生符藥安詳之上草自然易產二逆產謂兒先露足者治法亦令產母仰臥分毫不得用力亦不得驚恐收生之人徐徐推其足就一邊直上候兒自順下直待良久若不順又漸漸推兒頭就一邊令其順下直待兒身轉順門路正當投下催生符藥即產三偏產謂兒頭偏往一旁雖逼近產門初分小露正頂止露額角者治法亦令產母仰臥收生之人輕輕推兒近上以手正其頭令兒頭頂端正向產門又有兒頭後骨偏往穀道者當以綿衣炙焙令熱裹手急於穀道外傍徐徐推之漸漸近上然後上草四礙產謂兒頭雖正產而不能生下者或因兒轉臍帶攀掛其肩致不能生者治法令產母仰臥收生之人輕手推兒近上徐徐通手引中指按兒兩肩理脫臍帶兒正即產五坐產謂兒將欲生產母疲倦不能行立久坐椅蓐抵兒生路不下生者治法當從高處懸吊手巾或絹帛一條令產母手攀輕輕屈足良久兒即順生以上五般手法若收生之人非心氣平和精良妙手切不可依此法施為恐不得其人恣其粗愚因而傷命當擇坐婆小心良善之人宜直言叮嚀詳盡其意凡有臨產先令產母吃少粥食安詳上草痛陣連並用力一送兒即下矣今具各方於後治孕婦大便秘澀方枳殼去白麵炒三兩防風去蘆二兩甘草炙一兩上為細末沸湯點一錢食日三服治兒在腹中哭方上以多年空屋下鼠穴中土令產母噙之即吐又方川黃連濃煎汁令母呷之治兒如抱壅方茱萸川烏秦艽柴胡白殭蠶直者洗巴戟生用巴豆去殼不用油者芫花醋煮各一兩上為細末煉蜜為丸如梧桐子大每服七丸蜜酒吞下取出惡即愈治橫倒生手足先出者方葵子二合黃明膠一兩滑石末一兩上水一盞半煎一盞去渣分作二服治逆產腳先出者方烏蛇蛻一條蟬蛻十四合血餘一個即胎髮上三味燒灰分作二服溫酒調下並進二服仰臥霎時兒即順生或用小絹針於兒腳心刺三五刺急用鹽少許塗刺去即生母子俱活不用針刺用谷尖亦好治產五七日不下垂死者及矮石女交骨不開者方取自死干龜殼酥炙無酥用醋炙及用生男女多者婦人頭髮一握燒存性用芎歸湯同煎服屢效約人行里生胎死胎俱下無自死龜殼用淮浙間鑽龜廢殼亦好催生方隨其便而用之但是末藥並要順研上用清油同蜜等分入湯少許調頻服之又黃葵花不以多少陰乾為末每服一匙頭熱酒調下無花用子微炒研末湯酒隨意服亦下死胎又蛇含石火煅醋淬七次為末每服一錢醋湯調下又乳香用燈心同研細不用燈心卻將蛤粉炒去粉二味不以多少以豬心血為丸如雞頭子大硃砂為衣每服一丸令酒磨下至成催生丹治產婦生理不順產育艱難或橫或逆臘月兔腦隨去皮膜研骨如泥滴乳香二錢半別研母丁香研末一杯麝香一字另研上拌勻三味以兔腦和丸雞頭子大油紙密封收之每用服一丸溫水下隨兒男左女右手握藥出留藥洗淨再收可三次催生如死兒必一取在頭上出也催生雄黃丸硃砂雄黃各一杯半蓖麻子十四個去皮上為細末漿水飯和丸彈子大臨產時先用椒湯淋洗臍下次安藥為臍內用醋紙數重傳藥上以闊帛系之須臾即生急取下藥一丸可用三遍催生神效柞木葉湯柞木葉連莖梗甘草各一握上水三升煮升半坐草時就房內暖溫通口服一二盞自在坐草不得亂用手法如橫生倒逆或死胎爛脹腹中不下者並服數盞自然生下治妊娠熱病心悶欲絕方葛根研取汁二升分作三服治胎動出血產門痛方黃連為末酒服一杯日進三服治漏胎下血不止胞乾子母即死急救方生地黃汁一升酒五盞上二味煎三五沸分三服或地黃末溫酒調服治產難方石燕一對令產母左右手各持一隻合手不問生死胎即下治產難胞衣不出兒死腹中欲絕方半夏白朮各一兩上二味治下胎酒服一錢若產難只一服橫生二服倒生三服兒死四服加黛赭瞿麥各二兩催生方蜀葵子四十九粒滑石白芷百草霜各三錢上為末雞子炒酒調空心二服如人行五里即下又方於婦人坐草時令人路上尋草鞋一隻取耳燒灰木香湯調服若能飲酒調三錢其草鞋若遇得左足者生男右者生女覆者兒死側者有驚此雖非切要催生極妙又方用好京墨新汲水濃磨服之墨水裹兒下此潘助教嘗用效又方用敗筆頭二個燒灰以藕蒂節研自然汁溫酒調下立效又方見兒面而未下挑灶中對鍋底下磚下黃土此小為末井花水調下余者搽產母臍中即下治橫逆生或手足先出方用菟絲子車前子末酒調下二錢又方取其父名書兒足下即順生治母死子不出法用水銀如彈子大斡開口灌之扶令坐食頃又扶令倚立子即出矣治子死腹中不出方用瞿麥二兩銼碎水八盞服一盞未出再服又方用蓖麻子一百粒去殼雄黃二錢一處研成膏攤紙上貼母右腳心先貯冷水一碗才下急洗去未下再貼亦治胎衣不下又方紅花酒煮汁服二三盞又方灶心黃土末酒服二錢鍋底墨亦得又方以牛糞塗腹上治胎不下方用米麥赤小豆同煮濃汁服立出催生極效真秘方用千人踏即路旁邊東廁上兩足所踏板上泥土以竹篦颳起研篩去沙加麝香少許擂早米飲飯丸如櫻桃子大瓦罐封收直候產婦坐草時痛至甚順取長流水送下不可服藥太早龍蛻散治橫生逆產蛇蛻皮罐子內泥固濟燒存性上為細末每服二錢榆白皮煎湯調下凡產不順手足先見者溫水下一錢匕仍用傳兒手足即順亦治吹乳二神湯治橫逆生瘦胎又治產前產後虛損月水不調崩中等疾百草霜香白芷各等分上為細末每服二錢童子小便醋各少許調熱浸化服不過二服神效治難產日月未足腹痛如迸者方用知母為細末丸如雞頭子大溫酒化服下死胎方桂末二錢麝香當門子一粒上研為細末溫酒服下治產難神驗方以皂角末少許吹鼻中令嚏兒即下治逆生方用鹽塗兒足底又可急搔抓之治子死腹中方用雌雞糞二十一枚水二升五合下米作粥食即下下死胎取胞衣產後去敗血推陳致新方用朴硝二錢溫童子小便調服瓜蔞散治死胎其證指甲青舌青脹口中臭者瓜蔞根一味焙為末每服二錢取順流水調下胎衣不下方皂角刺不以多少燒灰為細末每服一大錢溫酒調下又方甜蔞實一個取子爛研蘇木等分酒及童子小便各半盞煎七分服亦能下死胎如不飲酒只用小便亦可又方用產母鞋底火炙熱熨大小腹上下三次又方用五靈脂揀去砂石及鐵屑之類一半生為細末每服二錢酒調下亦治惡血衝心又方浸苧水濃者溫服二碗即下催生方老鴉酸草生用不以多少臨產時入砂盆內搗爛不可福布攪取汁半盞順流水半盞相和火上溫過服之於五月五日採取陰乾為末收起臨產調服治產婦腹脹腫痛不可忍方上方煮鼠黏根為飲一服即愈返魂丹治婦人胎前產後諸疾危證此係吉安文江高師禹備方禮水明醫而得之後施此藥獲安而得活者多人能依法合施亦陰德也其效神妙上用赤前野天麻葉開紫花如紅蓼花名茺蔚子是也又名益明又名大禮又名真尉又名益母四月五月採取陰乾用葉及花子磁器內研為細末煉蜜丸如彈子大隨後治證嚼服其根燒存性為末酒調服功與黑神散不相上下胎前臍腹作痛或作聲者溫米飲下二治催生方川芎當歸尾芍藥生地黃熟地黃滑石葵子四十九粒研末枳殼肉桂甘草木通上用順水煎不拘時服
