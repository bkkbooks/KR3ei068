body:
  text: 上卷濟生產寶論夫天地造端於夫婦乾坤配合於陰陽雖清濁動靜之不同乃成象效法之有類原茲婦人之病與男子不同者亦有數焉古方以婦人病比男子十倍難治不亦言之深乎但三十六病產褥一門男子無之其如外傷風暑寒濕內積喜怒憂思飲食房勞虛實寒熱悉與丈夫一同也依源治療可得而知之惟古書治婦人別著方論者以其胎妊生產崩傷之異故婦人之病比之男子十倍難療蓋女子嗜欲多於丈夫感病倍於男子加之慈戀愛憎嫉妒憂恚染著堅牢情不自抑所以為病根深治之難瘥況懷胎妊娠而挾病也不持避其毒藥仍須審其虛實冷熱而調治之無使妄投湯劑以致夭枉產寶病源論大率治病先論其所主男子調其氣女子調其血氣血人之神也不可不謹調護然婦人以血為基本氣血宣行其神自清所謂血室不蓄則氣和血凝結則水火相刑月水如期謂之月信不然血凝成孕此乃調燮之常其血不來則因風熱傷於經血故血不通或外感風寒內受邪熱脾胃虛弱不能飲食食既不充榮衛抑遏肌膚黃燥面無光澤時發寒熱腹脹作痛難於子息子臟冷熱久而勞損必挾帶下便多淋瀝忽致崩漏經云腹中如塊忽聚忽散其病乃癥血涸不流而搏腹脹時作寒熱此乃成瘕或先或後失期雖通而或多或寡究病之源蓋本於此精血論出齊光祿大夫褚澄遺書飲食五味養髓骨肉血肌膚毛髮男子為陽陽中必有陰陰中之數八故一八而陽精升二八而陽精溢女子為陰陰中必有陽陽中之數七故一七而陰血升二七而陰血溢皆飲食五味之實秀也方其升也智慮開明齒髮更始發黃者黑筋弱者強暨其溢也凡充身體手足耳目之餘雖針芥之歷無有不下凡子形肖父母者以其精血嘗於父母之身無所不歷也是以父一肢廢則子一肢不肖其父母一目虧則子一目不肖其母然雌鳥牝獸無天癸而成胎何也鳥獸精血往來尾間也精未通而御女以通其精則五體有不滿之處異日有難狀之疾陰已痿而思色以降其精則精不出而內敗小便道澀而為淋精已耗而復竭之則大小便道牽疼愈疼則愈欲大小便愈便則愈疼女人天癸既至逾十年無男子合則不調未逾十年思男子合亦不調不調則舊血不出新血誤行或漬而入骨或變而之腫或雖合而難子合男子多則瀝枯虛人產乳眾則血枯殺人觀其精血思過半矣月經不調論論曰經者常候謂候其一身之陰陽愆伏知其安危故其來必以月太過不及皆為不調過於陽則前期而來過於陰則後時而至其有乍多乍少斷絕不行崩漏不止亦由陰陽衰盛寒熱為邪若寒溫乖適經脈則虛若有風冷虛則乘之邪搏於血或寒或溫寒則血結溫則血消故月水乍多乍少故為不調也棰仁散治婦人月水不調或淋瀝不斷斷後復來狀如瀉水四體虛翕不能飲食腹中堅痛不可行動月水或前或後或經月不來舉體沉重惟欲眠睡多思酸物桃仁去皮尖炒粉草半夏各一兩赤芍藥生地黃各三兩澤蘭葉川牛膝當歸桂心牡丹皮人參蒲黃川芎各二兩上為粗末每服五錢水盞半姜三片煎七分空心溫服通經取下方曾經試驗神效蛤粉半兩苦葶藶牙皂各二錢半山豆略去油天花粉半兩苦丁香紅娘子各一錢半麝香少許上八味以厚紙包裝研為末每用一錢蔥涎搗為丸薄綿裹以五寸竹管納陰中候熱時先通黃水次則經行通經丸治婦人室女月候不通疼痛或成血瘕桂心青皮大黃煨川椒莪朮乾薑川烏炮去皮乾漆碎之炒令煙淨當歸棰仁去皮尖炒各等分上為細末分為四份用一份以米醋熬成膏和余藥末成劑臼中治之圓如梧桐子晾乾每服二十丸至三十丸淡醋湯下溫酒亦得性畏漆者入雞子清和於內空心食前服婦人論夫產育一科診脈用方不可輕忽蓋產前之病其脈貴乎實產後之病其脈貴乎虛產前則為之順氣安胎產後為之扶虛消瘀此其要也抑產育之後血衰氣弱宿瘀未盡飲食起居梳洗解脫一有不謹得病猶甚易焉凡婦人血氣諸疾但用四物湯加以炒吳茱萸主之陰臟加多陽臟加少無不效者若產難若胎衣不下若胎損腹中則入醋夾煎或生料五積散加芎歸縮砂煎之以水醋或局方黑神散用乳香煎湯調下皆其類耳此外則有芎歸湯佐以縮砂調理胎婦腹痛或胎動下血更以炒阿膠並熟艾濟之至若胎婦喘咳則縮砂川芎炒阿膠等分入生薑烏梅紫蘇梗最良胎婦艱食則調氣散枳殼散等分入縮砂為妙大小產後津液涸燥滯血停流易至大便秘結枳殼散加炒桃仁用蜜水同煎入醋數沸可也縮胎之劑枳殼縮砂烏藥所不可無安胎之劑阿膠縮砂桑寄生又不可缺婦人多因怒氣傷胎所以安胎尤莫先於順氣其於產後發熱黑神散加川芎荊芥入生薑蔥白尤佳產後消瘀黑神散須多服耳至一七以後腹中略無疼痛方可與四物建中湯輩服之太早則補住敗血為害非輕求子論治論曰素問云天地者萬物之父母也陰陽者血氣之男女也夫有夫婦則有父子婚姻之後則有生育生育者人倫之本也且男女之合二情交暢陰血先至陽精後沖血開裹精陰外陽內陰含陽胎而男形成矣陽精先至陰血後參精開裹血陽外陰內陽含陰胎而女形成矣若夫受形之易者男女必當其年男子二八精氣溢瀉必三十而娶女子二七天癸至必二十而嫁欲其二氣充實然後交合交而孕孕而育育而壽倘若婚嫁不時真氣早泄未完而傷是以交而不孕孕而不育育而不壽者多矣以此觀之男女婚姻貴乎及時夫婦貴乎益壯則易於受形也是父少母老生女必羸母壯父衰生男必弱誠有斯理或男子真精不濃婦人血衰而氣旺是謂夫病婦疾皆使人無子治療之法女子當養血抑氣以減喜怒男子益腎生精以節嗜欲依方調治陰陽和平則婦人樂有子矣抑氣散婦人氣盛於血所以無子尋常頭暈膈滿體痛怔忡皆可服之香附乃婦人仙藥也不可謂其耗氣而勿服香附子炒杵淨四兩茯神去水四兩橘紅二兩甘草一兩炙上為細末每服二錢食前用沸湯服仍兼進紫石英丸紫石英丸治婦人血弱子臟風冷凝滯令人少子紫石英火煅醋淬十次二兩禹餘糧火煅醋淬七次二兩熟地黃洗紫威辛夷仁桂心不見火牡蒙老柏葉醋炙川續斷酒浸石斛去根柏子仁炒別研川烏炮去皮川牛膝酒浸芎藭烏賊魚骨醋炙當歸酒浸牡丹皮去水甘草炙以上各一兩桑寄生山藥銼炒食茱萸炒細辛乾薑以上各半兩人參三分厚朴制炒一分天門冬去心一兩半上為細末煉蜜為丸如梧桐子大每服七十丸加至一百丸空心用米飲任下惡蜜者用醋糊為丸陽起石丸治丈夫真精氣不濃不能施行是以無子陽起石火煅紅研極細鹿茸酒蒸焙菟絲子水淘淨酒浸蒸焙別研天雄炮去皮韭子炒肉蓯蓉酒浸以上各一兩覆盆子酒浸石斛去根桑寄生沉香別研原蠶蛾酒炙五味子以上各半兩上為細末酒煮米糊為丸如梧桐子大每服七十丸空心用鹽湯鹽酒任下惡阻論治論曰內經云陰搏陽別謂之有子三部脈浮沉正等無病者乃知有娠也妊既受矣多病惡阻惡阻者俗言所謂惡食是也此由婦人本虛平時喜怒不節當風取冷中脘宿有痰飲受妊經血既閉飲血相搏氣不宣通遂致心下憒悶頭暈眼花四肢沉重懈怠惡聞食氣喜食鹹酸多臥少起甚則吐逆不自勝持治療之法順氣理血豁痰導水然後平安也參橘散治妊娠三月惡阻吐逆不食或心虛煩悶赤茯苓陳皮去白以上各一兩麥門冬去心厚朴薑製炒白朮人參甘草各一兩上㕮咀每服四錢半生薑七片刮竹茹一團煎至七分去渣溫服不拘時半夏湯治妊娠心中憒悶頭目眩暈四肢怠惰百節疼痛痰逆嘔吐嫌聞食氣好食鹹酸多睡宜服半夏湯炮七次一錢半茯苓六錢熟地黃陳皮去白人參細辛川芎桔梗白芍藥紫蘇葉甘草以上各一錢有客熱煩渴口瘡去陳皮細辛加前胡知母腹冷痢去地黃加桂心胃中虛熱大便秘小便澀去地黃加黃芩六錢大黃一錢二分炮上㕮咀每服四錢水一盞半姜七片煎空心服旋覆半夏湯治妊娠阻病心下憒悶吐逆不食惡聞食氣頭暈四肢百節煩痛多臥少起旋覆花芎藭細辛去土人參甘草炙各半兩半夏湯炮七次當歸酒浸乾薑赤茯苓去皮陳皮去白各一兩上㕮咀每服四錢水一盞半生薑五片煎至七分去渣溫服不拘時人參半夏丸治妊娠惡阻病溱心胸中冷腹痛吐逆不喜食半夏湯泡七次人參乾薑各半兩上為細末以生地黃汁浸蒸餅為丸如梧桐子大每服四十丸用米飲送下不拘時縮砂散治妊娠胃虛氣逆嘔吐不食縮砂仁不拘多少上為細末每服二錢入生薑自然汁少許沸湯點服子煩證論論曰妊娠四月六月多苦煩悶按醫經四月受少陰君火氣以養精六月受少陽相火氣以養氣所以如是又有不拘此兩月而苦煩悶者由母將理失宜七情傷感心驚膽怯而然也麥門冬湯治妊娠心驚膽虛煩悶麥門冬去心防風黃芩白茯苓各一兩人參半兩上㕮咀每服四錢水一盞半生薑五片淡竹葉十片煎至八分去渣溫服不拘時腎著湯治妊娠腰腳腫痛白茯苓白朮乾薑炮甘草各二錢杏仁三錢去皮炒計一兩一錢銼作四服水一盞半煎空心服枳殼散治妊娠食物無度既飽便睡以至胞厚胎肥臨月難產湖陽公主妊娠七八月服之有效蓋唇枳殼一兩去穰銼片麩炒黃色為度甘草五錢炙上為細末空心沸湯點服勿登高廁救生散安胎益氣易產人參訶子煨去核麥芽炒白朮銼炒神麯炒橘紅炒上六味等分為細末每服三錢水一盞煎至七分空心食前溫服芎蘇散治婦人妊娠外感風寒渾身壯熱眼暈頭旋心胸煩悶此藥以發散表邪其病自安紫蘇葉川芎白朮白芍藥麥門冬陳皮乾葛甘草上㕮咀每服用水一盅半生薑五片蔥白三寸煎服不拘時罩胎散治妊娠傷寒大熱悶亂燥渴恐傷胎氣卷荷葉焙一兩蛤粉半兩上為細末每服二錢入蜜少許新汲水調下食前服逍遙散內加遠志蘇木紅花桃仁枳殼治婦人癲狂神效上㕮咀用水一盅生薑三片生地黃煎服薑黃散治婦人久患血氣臍腹急痛嘔逆上喘困倦無力煩熱口乾四肢沉重赤白帶下睡臥不安薑黃四兩當歸芍藥蓬莪朮牡丹皮以上各二兩紅花炒川芎官桂玄胡索以上各一兩上為細末每服五錢酒水各一盞煎至七分和渣熱服立效壯實婦人加川大黃一兩胎前十八證問答第一問妊娠受胎三兩個月胎動不安者何答曰男女陰陽會通血氣勻調乃成其孕設若下血落胎腹痛蓋由子宮久虛血海虛羸至令胎墮其危甚於正產若妊娠曾受此苦可預服杜仲丸通靈散等藥以養胎杜仲丸杜仲去皮銼薑汁浸炒去絲川續斷酒浸各一兩上為細末棗肉煮爛杵和為丸如梧桐子大每服七十丸空心米飲送下日進二服通靈散木香不見火芎藭各二錢黑附子去皮齊炮白芍藥牡丹皮白朮乾薑炮黃耆山藥甘草熟地黃以上各二錢陳皮去白四錢上㕮咀每服四錢糯米五七粒水一盞半煎每日二服忌生冷白朮散治妊娠宿有風冷胎屢不安或失將理動傷胎氣多損胎墮下常服保護胎臟白朮川芎各六錢牡蠣五錢煅川椒去並目半兩炒放地上盆蓋出汗腹痛加白芍藥一錢半心痛加川芎一錢半心煩嘔吐加半夏半錢湯炮七次並細辛一錢半上為細末用溫酒或米飲調下如渴用大麥汁調服惡阻婦人宜作丸子服室女帶下亦治安胎散治妊娠胎寒腹痛胎熱多驚舉動腰痛滿胞急卒有所下或因頓僕閃肭飲食毒物感時候寒熱往來致傷胎臟並宜服之川芎六錢枳殼六錢去穰麩炒熟地黃一兩二錢糯米一合加金銀花煎上銼每服五錢水一盞半生薑五片棗一枚煎空心服又方用陳皮多年者佳一兩